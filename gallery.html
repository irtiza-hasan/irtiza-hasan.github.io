
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gallery - Irtiza Hasan</title>

  <meta
    name="description"
    content="Conference moments, research presentations, group photographs, and academic memories from Irtiza Hasan."
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <style>
    :root {
      --charlotte-green: #004f2d;
      --charlotte-gold: #b9975b;
      --page-green: #006b3f;
      --deep-green: #003d24;
      --soft-white: #f4f7f5;
      --muted-white: #dce5e0;
      --photo-paper: #f8f8f5;
      --photo-ink: #25372e;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: #ffffff;
      background-color: var(--page-green);
      font-family: "Roboto Mono", monospace;
    }

    button,
    a {
      font-family: inherit;
    }

    /* =============================
       CONSTELLATION BACKGROUND
    ============================= */

    #constellation-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
    }

    #content-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
    }

    /* =============================
       HEADER
    ============================= */

    .top-header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 30;

      display: flex;
      align-items: center;
      justify-content: space-between;

      width: 100%;
      height: var(--header-height);
      padding: 0 28px;

      color: #ffffff;
      background-color: var(--charlotte-green);
      border-bottom: 1px solid rgba(185,151,91,0.48);
    }

    .brand {
      color: #ffffff;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .brand:hover {
      color: var(--charlotte-gold);
    }

    .navbar {
      align-items: center;
    }

    .navbar a {
      position: relative;
      margin-left: 26px;
      padding: 21px 0 19px;
      color: #ffffff;

      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;

      transition: color 0.2s ease;
    }

    .navbar a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 13px;
      left: 0;

      height: 2px;
      background-color: var(--charlotte-gold);
      transform: scaleX(0);
      transition: transform 0.2s ease;
    }

    .navbar a:hover,
    .navbar a.active {
      color: var(--charlotte-gold);
    }

    .navbar a:hover::after,
    .navbar a.active::after {
      transform: scaleX(1);
    }

    /* =============================
       MOBILE MENU
    ============================= */

    #mobile-menu-button {
      position: relative;
      z-index: 50;
      padding: 8px;
      color: #ffffff;
      background: transparent;
      border: 0;
      cursor: pointer;
    }

    #mobile-menu {
      position: fixed;
      inset: 0;
      z-index: 25;
      background-color: var(--deep-green);
    }

    .mobile-menu-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      gap: 30px;
    }

    .mobile-link {
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .mobile-link:hover,
    .mobile-link.active {
      color: var(--charlotte-gold);
    }

    /* =============================
       PAGE LAYOUT
    ============================= */

    .page-wrap {
      min-height: 100vh;
      padding-top: var(--header-height);
    }

    .content-card {
      position: relative;
      width: 100%;
      min-height: calc(100vh - var(--header-height));

      padding:
        clamp(72px,7vw,110px)
        clamp(28px,8.5vw,140px)
        clamp(64px,7vw,105px);

      background: transparent;
      animation: fadeInUp 0.55s ease both;
    }

    .main-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1180px;
    }

    .section-kicker {
      margin-bottom: 18px;
      color: var(--charlotte-gold);
      font-size: clamp(0.72rem,1.2vw,0.88rem);
      font-weight: 700;
      line-height: 1.7;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0;
      color: #ffffff;
      font-size: clamp(3rem,7vw,6.4rem);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.065em;
      text-shadow: 0 4px 22px rgba(0,36,21,0.22);
    }

    .page-title span {
      color: var(--charlotte-gold);
    }

    .gold-rule {
      width: 130px;
      height: 3px;
      margin-top: 31px;
      margin-bottom: 54px;

      background: linear-gradient(
        90deg,
        var(--charlotte-gold),
        rgba(185,151,91,0)
      );
    }

    /* =============================
       GALLERY MASONRY
    ============================= */

    .gallery-grid {
      width: 100%;
      max-width: 1120px;
      column-count: 2;
      column-gap: 2.3rem;
    }

    /*
      All regular photographs now have
      a physical Polaroid appearance.
    */

    .gallery-item {
      --rotation: -2deg;

      position: relative;
      display: inline-block;
      vertical-align: top;
      break-inside: avoid;

      width: calc(100% - 24px);
      margin: 18px 12px 35px;
      padding: 10px 10px 0;

      background: var(--photo-paper);
      border-radius: 4px;

      box-shadow:
        0 18px 38px rgba(0,25,14,0.38),
        0 5px 13px rgba(0,25,14,0.20);

      transform: rotate(var(--rotation));

      transition:
        transform 0.28s ease,
        box-shadow 0.28s ease;
    }

    .gallery-item:nth-child(4n+2) {
      --rotation: 2.3deg;
    }

    .gallery-item:nth-child(4n+3) {
      --rotation: -1.6deg;
    }

    .gallery-item:nth-child(4n+4) {
      --rotation: 1.5deg;
    }

    .gallery-item:hover {
      position: relative;
      z-index: 6;

      transform:
        translateY(-7px)
        rotate(0deg);

      box-shadow:
        0 24px 48px rgba(0,25,14,0.46),
        0 8px 18px rgba(0,25,14,0.25);
    }

    .gallery-item img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      background: #e9ece8;
      user-select: none;
      pointer-events: none;
    }

    /*
      Captions are printed on the white
      Polaroid bottom border, not
      over the photograph.
    */

    .image-caption {
      display: flex;
      align-items: center;
      justify-content: center;

      min-height: 70px;
      padding: 15px 10px 16px;

      color: var(--photo-ink);
      background: var(--photo-paper);

      font-size: 0.76rem;
      font-weight: 600;
      line-height: 1.55;
      letter-spacing: -0.025em;
      text-align: center;
    }

    /* =============================
       ITW 2026 PHOTO DECK
    ============================= */

    .itw-album {
      display: inline-block;
      vertical-align: top;
      break-inside: avoid;

      width: 100%;
      margin: 0 0 30px;
      padding: 0;
      text-align: center;
      isolation: isolate;
    }

    .itw-stage {
      position: relative;
      width: 100%;
      height: clamp(325px,35vw,465px);
    }

    .itw-photo {
      position: absolute;
      top: 50%;
      left: 50%;

      display: block;
      width: 57%;
      height: 82%;

      object-fit: cover;
      object-position: center;

      background: var(--photo-paper);

      border: 8px solid var(--photo-paper);
      border-bottom-width: 24px;
      border-radius: 4px;

      box-shadow:
        0 14px 32px rgba(0,20,12,0.42),
        0 4px 12px rgba(0,20,12,0.22);

      transform-origin: center 88%;
      pointer-events: none;
      user-select: none;

      transition:
        transform 0.45s cubic-bezier(.22,.8,.22,1),
        box-shadow 0.3s ease;
    }

    .itw-photo[data-slot="-2"] {
      z-index: 1;
      transform:
        translate(-50%,-50%)
        translateX(-35%)
        translateY(15px)
        rotate(-19deg)
        scale(0.94);
    }

    .itw-photo[data-slot="-1"] {
      z-index: 3;
      transform:
        translate(-50%,-50%)
        translateX(-18%)
        translateY(7px)
        rotate(-10deg)
        scale(0.98);
    }

    .itw-photo[data-slot="0"] {
      z-index: 5;
      transform:
        translate(-50%,-50%)
        translateY(-8px)
        rotate(0deg)
        scale(1.04);

      box-shadow:
        0 20px 42px rgba(0,20,12,0.5),
        0 6px 15px rgba(0,20,12,0.26);
    }

    .itw-photo[data-slot="1"] {
      z-index: 3;
      transform:
        translate(-50%,-50%)
        translateX(18%)
        translateY(7px)
        rotate(10deg)
        scale(0.98);
    }

    .itw-photo[data-slot="2"] {
      z-index: 1;
      transform:
        translate(-50%,-50%)
        translateX(35%)
        translateY(15px)
        rotate(19deg)
        scale(0.94);
    }

    /* =============================
       ITW LEFT/RIGHT NAVIGATION
    ============================= */

    .itw-arrow {
      position: absolute;
      top: 50%;
      z-index: 10;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      width: 62px;
      height: 76px;
      gap: 6px;
      padding: 0;

      color: var(--deep-green);
      background: var(--charlotte-gold);

      border: 2px solid #f2e1bc;
      border-radius: 10px;

      box-shadow: 0 8px 25px rgba(0,20,12,0.35);

      cursor: pointer;
      transform: translateY(-50%);

      transition:
        background-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .itw-arrow:hover {
      background-color: #f4ddb0;
      box-shadow: 0 10px 30px rgba(0,20,12,0.45);
    }

    .itw-arrow:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }

    .itw-arrow i {
      font-size: 1.35rem;
    }

    .itw-arrow span {
      font-size: 0.63rem;
      font-weight: 700;
      letter-spacing: 0.035em;
    }

    .itw-prev {
      left: 0;
    }

    .itw-next {
      right: 0;
    }

    .itw-caption {
      margin-top: 15px;
      color: #ffffff;
      font-size: 0.89rem;
      font-weight: 700;
      line-height: 1.65;
      text-shadow: 0 2px 8px rgba(0,20,12,0.25);
    }

    /* =============================
       CONTACT STRIP
    ============================= */

    .contact-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;

      width: 100%;
      max-width: 1120px;
      gap: 16px 28px;

      margin-top: 46px;
      padding-top: 28px;

      color: var(--muted-white);
      border-top: 1px solid rgba(255,255,255,0.2);

      font-size: 0.86rem;
      line-height: 1.7;
    }

    .contact-strip span {
      display: inline-flex;
      align-items: center;
    }

    .contact-strip i {
      width: 18px;
      margin-right: 9px;
      color: var(--charlotte-gold);
      text-align: center;
    }

    .contact-strip a {
      color: var(--charlotte-gold);
      font-weight: 700;
      text-decoration: none;
    }

    .contact-strip a:hover {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .bottom-accent {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 4px;

      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(185,151,91,0.4) 18%,
        var(--charlotte-gold) 50%,
        rgba(185,151,91,0.4) 82%,
        transparent 100%
      );
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =============================
       RESPONSIVE
    ============================= */

    @media (max-width: 900px) {
      .top-header {
        padding: 0 20px;
      }

      .content-card {
        padding: 82px 34px 70px;
      }

      .main-content {
        margin: 0 auto;
        text-align: center;
      }

      .gold-rule {
        margin-right: auto;
        margin-left: auto;

        background: linear-gradient(
          90deg,
          transparent,
          var(--charlotte-gold),
          transparent
        );
      }

      .gallery-grid {
        column-count: 1;
        max-width: 760px;
        margin-right: auto;
        margin-left: auto;
      }

      .gallery-item {
        width: calc(100% - 36px);
        margin: 16px 18px 34px;
      }

      .itw-album {
        display: block;
        max-width: 560px;
        margin: 0 auto 35px;
      }

      .itw-stage {
        height: clamp(330px,60vw,460px);
      }

      .contact-strip {
        justify-content: center;
        max-width: 760px;
        margin-right: auto;
        margin-left: auto;
      }
    }

    @media (max-width: 640px) {
      :root {
        --header-height: 60px;
      }

      .top-header {
        padding: 0 14px 0 18px;
      }

      .brand {
        font-size: 0.96rem;
      }

      .content-card {
        padding: 70px 20px 56px;
      }

      .section-kicker {
        font-size: 0.7rem;
      }

      .page-title {
        font-size: clamp(2.8rem,15vw,4.2rem);
      }

      .gold-rule {
        margin-top: 27px;
        margin-bottom: 32px;
      }

      .gallery-grid {
        column-gap: 0;
      }

      .gallery-item {
        width: calc(100% - 24px);
        margin: 14px 12px 30px;
        padding: 7px 7px 0;
      }

      .image-caption {
        min-height: 58px;
        padding: 12px 8px 14px;
        font-size: 0.7rem;
      }

      .itw-stage {
        height: 310px;
      }

      .itw-photo {
        width: 62%;
        height: 77%;
        border-width: 5px;
        border-bottom-width: 17px;
      }

      .itw-arrow {
        width: 48px;
        height: 62px;
        gap: 4px;
        border-radius: 8px;
      }

      .itw-arrow i {
        font-size: 1.15rem;
      }

      .itw-arrow span {
        font-size: 0.55rem;
      }

      .itw-caption {
        font-size: 0.81rem;
      }

      .contact-strip {
        flex-direction: column;
        align-items: center;
        gap: 13px;
        margin-top: 36px;
        padding-top: 24px;
        font-size: 0.78rem;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <canvas
    id="constellation-canvas"
    aria-hidden="true">
  </canvas>

  <div id="content-container">

    <!-- HEADER -->

    <header class="top-header">

      <a href="/" class="brand">
        Irtiza Hasan
      </a>

      <nav
        class="navbar hidden md:flex"
        aria-label="Main navigation">

        <a href="/">Home</a>
        <a href="/education.html">Education</a>
        <a href="/publications.html">Publications</a>
        <a href="/service.html">Service</a>

        <a
          href="/gallery.html"
          class="active"
          aria-current="page">
          Gallery
        </a>

      </nav>

      <div class="md:hidden">

        <button
          id="mobile-menu-button"
          type="button"
          aria-label="Open mobile menu"
          aria-controls="mobile-menu"
          aria-expanded="false">

          <svg
            id="menu-icon"
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h16">
            </path>
          </svg>

          <svg
            id="close-icon"
            class="hidden w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true">

            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M6 18L18 6M6 6l12 12">
            </path>
          </svg>

        </button>

      </div>

    </header>

    <!-- MOBILE MENU -->

    <div
      id="mobile-menu"
      class="hidden md:hidden">

      <nav
        class="mobile-menu-content"
        aria-label="Mobile navigation">

        <a href="/" class="mobile-link">
          Home
        </a>

        <a href="/education.html" class="mobile-link">
          Education
        </a>

        <a href="/publications.html" class="mobile-link">
          Publications
        </a>

        <a href="/service.html" class="mobile-link">
          Service
        </a>

        <a
          href="/gallery.html"
          class="mobile-link active"
          aria-current="page">
          Gallery
        </a>

      </nav>
    </div>

    <!-- MAIN CONTENT -->

    <main class="page-wrap">

      <section class="content-card">

        <section class="main-content">

          <div class="section-kicker">
            Research Life
          </div>

          <h1 class="page-title">
            Gallery<span>.</span>
          </h1>

          <div
            class="gold-rule"
            aria-hidden="true">
          </div>

          <!-- GALLERY -->

          <div class="gallery-grid">

            <!-- ==========================
                 ITW 2026 PHOTO DECK
            =========================== -->

            <figure
              class="itw-album"
              id="itw-album"
              aria-label="ITW 2026 photo collection">

              <div class="itw-stage">

                <img
                  class="itw-photo"
                  src="/images/ITW1.jpeg"
                  alt="ITW 2026 photograph 1"
                  data-slot="0"
                  loading="lazy"
                  draggable="false"
                />

                <img
                  class="itw-photo"
                  src="/images/ITW2.jpeg"
                  alt="ITW 2026 photograph 2"
                  data-slot="1"
                  aria-hidden="true"
                  loading="lazy"
                  draggable="false"
                />

                <img
                  class="itw-photo"
                  src="/images/ITW3.jpeg"
                  alt="ITW 2026 photograph 3"
                  data-slot="2"
                  aria-hidden="true"
                  loading="lazy"
                  draggable="false"
                />

                <img
                  class="itw-photo"
                  src="/images/ITW4.jpeg"
                  alt="ITW 2026 photograph 4"
                  data-slot="-2"
                  aria-hidden="true"
                  loading="lazy"
                  draggable="false"
                />

                <img
                  class="itw-photo"
                  src="/images/ITW5.jpeg"
                  alt="ITW 2026 photograph 5"
                  data-slot="-1"
                  aria-hidden="true"
                  loading="lazy"
                  draggable="false"
                />

                <button
                  type="button"
                  id="itw-prev"
                  class="itw-arrow itw-prev"
                  aria-label="Previous ITW photograph">

                  <i
                    class="fas fa-chevron-left"
                    aria-hidden="true">
                  </i>

                  <span>PREV</span>
                </button>

                <button
                  type="button"
                  id="itw-next"
                  class="itw-arrow itw-next"
                  aria-label="Next ITW photograph">

                  <i
                    class="fas fa-chevron-right"
                    aria-hidden="true">
                  </i>

                  <span>NEXT</span>
                </button>

              </div>

              <figcaption class="itw-caption">
                Some photos from ITW 2026
              </figcaption>

            </figure>

            <!-- ==========================
                 SPRING 2026
            =========================== -->

            <figure class="gallery-item">

              <img
                src="/images/GRP_Spring2026.jpg"
                alt="Research group photo from Spring 2026"
                loading="lazy"
              />

              <figcaption class="image-caption">
                Group Photo — Spring 2026
              </figcaption>

            </figure>

            <!-- ==========================
                 ASILOMAR POSTER 2025
            =========================== -->

            <figure class="gallery-item">

              <img
                src="/images/AsilomarUlukus.jpeg"
                alt="Poster presentation at Asilomar 2025"
                loading="lazy"
              />

              <figcaption class="image-caption">
                Poster Presentation at Asilomar Conference 2025
              </figcaption>

            </figure>

            <!-- ==========================
                 ASILOMAR STATE BEACH
            =========================== -->

            <figure class="gallery-item">

              <img
                src="/images/AsilomarIrtiza.jpeg"
                alt="Irtiza Hasan at Asilomar State Beach"
                loading="lazy"
              />

              <figcaption class="image-caption">
                Asilomar State Beach in Pacific Grove
              </figcaption>

            </figure>

            <!-- ==========================
                 ALLERTON 2025
            =========================== -->

            <figure class="gallery-item">

              <img
                src="/images/Allerton.jpg"
                alt="With Prof. Melih Baştopçu and Prof. Sennur Ulukus at Allerton 2025"
                loading="lazy"
              />

              <figcaption class="image-caption">
                With Prof. Melih Baştopçu and
                Prof. Sennur Ulukus at Allerton 2025
              </figcaption>

            </figure>

            <!-- ==========================
                 SEPTEMBER 2025
            =========================== -->

            <figure class="gallery-item">

              <img
                src="/images/Group Photo Sep.jpg"
                alt="Research group photo from September 2025"
                loading="lazy"
              />

              <figcaption class="image-caption">
                Group Photo — September 2025
              </figcaption>

            </figure>

            <!-- ==========================
                 AUGUST 2024
            =========================== -->

            <figure class="gallery-item">

              <img
                src="/images/3.jpeg"
                alt="Research group photo from August 2024"
                loading="lazy"
              />

              <figcaption class="image-caption">
                Group Photo — August 2024
              </figcaption>

            </figure>

            <!-- ==========================
                 IEEE ICC 2026
            =========================== -->

            <figure class="gallery-item">

  <!-- =============================
       PHOTO NAVIGATION
  ============================= -->

  <script>
    document.addEventListener("DOMContentLoaded", () => {

      const album =
        document.getElementById("itw-album");

      const photos = Array.from(
        album.querySelectorAll(".itw-photo")
      );

      const previousButton =
        document.getElementById("itw-prev");

      const nextButton =
        document.getElementById("itw-next");

      let currentIndex = 0;
      const totalPhotos = photos.length;

      function updatePhotoDeck() {

        photos.forEach((photo, index) => {

          let relativeIndex =
            (index - currentIndex + totalPhotos)
            % totalPhotos;

          if (
            relativeIndex >
            Math.floor(totalPhotos / 2)
          ) {
            relativeIndex -= totalPhotos;
          }

          photo.dataset.slot =
            String(relativeIndex);

          photo.setAttribute(
            "aria-hidden",
            String(index !== currentIndex)
          );

        });
      }

      function showNextPhoto() {
        currentIndex =
          (currentIndex + 1) % totalPhotos;

        updatePhotoDeck();
      }

      function showPreviousPhoto() {
        currentIndex =
          (currentIndex - 1 + totalPhotos)
          % totalPhotos;

        updatePhotoDeck();
      }

      previousButton.addEventListener(
        "click",
        showPreviousPhoto
      );

      nextButton.addEventListener(
        "click",
        showNextPhoto
      );

      album.addEventListener("keydown", (event) => {

        if (event.key === "ArrowRight") {
          event.preventDefault();
          showNextPhoto();
        }

        if (event.key === "ArrowLeft") {
          event.preventDefault();
          showPreviousPhoto();
        }

      });

      updatePhotoDeck();

      /* MOBILE MENU */

      const mobileMenuButton =
        document.getElementById("mobile-menu-button");

      const mobileMenu =
        document.getElementById("mobile-menu");

      const menuIcon =
        document.getElementById("menu-icon");

      const closeIcon =
        document.getElementById("close-icon");

      function closeMobileMenu() {
        mobileMenu.classList.add("hidden");

        mobileMenuButton.setAttribute(
          "aria-expanded",
          "false"
        );

        mobileMenuButton.setAttribute(
          "aria-label",
          "Open mobile menu"
        );

        menuIcon.classList.remove("hidden");
        closeIcon.classList.add("hidden");

        document.body.style.overflow = "";
      }

      function openMobileMenu() {
        mobileMenu.classList.remove("hidden");

        mobileMenuButton.setAttribute(
          "aria-expanded",
          "true"
        );

        mobileMenuButton.setAttribute(
          "aria-label",
          "Close mobile menu"
        );

        menuIcon.classList.add("hidden");
        closeIcon.classList.remove("hidden");

        document.body.style.overflow = "hidden";
      }

      mobileMenuButton.addEventListener("click", () => {

        const isOpen =
          mobileMenuButton.getAttribute("aria-expanded")
          === "true";

        if (isOpen) {
          closeMobileMenu();
        } else {
          openMobileMenu();
        }

      });

      document
        .querySelectorAll(".mobile-link")
        .forEach((link) => {
          link.addEventListener("click", closeMobileMenu);
        });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          closeMobileMenu();
        }
      });

    });
  </script>

  <!-- =============================
       CONSTELLATION ANIMATION
  ============================= -->

  <script>
    (() => {

      const canvas =
        document.getElementById("constellation-canvas");

      if (!canvas) return;

      const context = canvas.getContext("2d");

      if (!context) return;

      const prefersReducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

      let particles = [];
      let animationFrameId = null;
      let resizeTimer = null;
      let devicePixelRatioValue = 1;

      class Particle {
        constructor(x, y, radius, velocityX, velocityY) {
          this.x = x;
          this.y = y;
          this.radius = radius;
          this.velocityX = velocityX;
          this.velocityY = velocityY;
        }

        update() {
          if (
            this.x + this.radius >= window.innerWidth ||
            this.x - this.radius <= 0
          ) {
            this.velocityX *= -1;
          }

          if (
            this.y + this.radius >= window.innerHeight ||
            this.y - this.radius <= 0
          ) {
            this.velocityY *= -1;
          }

          this.x += this.velocityX;
          this.y += this.velocityY;
        }

        draw() {
          context.beginPath();

          context.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI * 2
          );

          context.fillStyle =
            "rgba(255,255,255,0.56)";

          context.fill();
        }
      }

      function getParticleCount() {
        if (window.innerWidth <= 640) return 38;
        if (window.innerWidth <= 1024) return 62;
        return 88;
      }

      function getConnectionDistance() {
        if (window.innerWidth <= 640) return 105;
        if (window.innerWidth <= 1024) return 125;
        return 145;
      }

      function createParticles() {
        particles = [];

        const particleCount = getParticleCount();

        for (
          let index = 0;
          index < particleCount;
          index += 1
        ) {
          const radius =
            Math.random() * 1.35 + 0.55;

          const x =
            Math.random() * window.innerWidth;

          const y =
            Math.random() * window.innerHeight;

          const speed =
            prefersReducedMotion ? 0 : 0.22;

          const velocityX =
            (Math.random() - 0.5) * speed;

          const velocityY =
            (Math.random() - 0.5) * speed;

          particles.push(
            new Particle(
              x,
              y,
              radius,
              velocityX,
              velocityY
            )
          );
        }
      }

      function resizeCanvas() {
        devicePixelRatioValue =
          Math.min(window.devicePixelRatio || 1, 2);

        canvas.width =
          window.innerWidth * devicePixelRatioValue;

        canvas.height =
          window.innerHeight * devicePixelRatioValue;

        canvas.style.width =
          `${window.innerWidth}px`;

        canvas.style.height =
          `${window.innerHeight}px`;

        context.setTransform(
          devicePixelRatioValue,
          0,
          0,
          devicePixelRatioValue,
          0,
          0
        );

        createParticles();
      }

      function drawConnections() {
        const maximumDistance =
          getConnectionDistance();

        const maximumDistanceSquared =
          maximumDistance * maximumDistance;

        for (
          let firstIndex = 0;
          firstIndex < particles.length;
          firstIndex += 1
        ) {
          for (
            let secondIndex = firstIndex + 1;
            secondIndex < particles.length;
            secondIndex += 1
          ) {
            const horizontalDistance =
              particles[firstIndex].x -
              particles[secondIndex].x;

            const verticalDistance =
              particles[firstIndex].y -
              particles[secondIndex].y;

            const distanceSquared =
              horizontalDistance * horizontalDistance +
              verticalDistance * verticalDistance;

            if (distanceSquared > maximumDistanceSquared) {
              continue;
            }

            const distance = Math.sqrt(distanceSquared);

            const opacity =
              0.28 * (1 - distance / maximumDistance);

            context.beginPath();

            context.moveTo(
              particles[firstIndex].x,
              particles[firstIndex].y
            );

            context.lineTo(
              particles[secondIndex].x,
              particles[secondIndex].y
            );

            context.strokeStyle =
              `rgba(185,151,91,${opacity})`;

            context.lineWidth = 0.8;
            context.stroke();
          }
        }
      }

      function renderFrame() {
        context.clearRect(
          0,
          0,
          window.innerWidth,
          window.innerHeight
        );

        particles.forEach((particle) => {
          particle.update();
          particle.draw();
        });

        drawConnections();

        if (!prefersReducedMotion) {
          animationFrameId =
            window.requestAnimationFrame(renderFrame);
        }
      }

      function restartAnimation() {
        if (animationFrameId !== null) {
          window.cancelAnimationFrame(animationFrameId);
        }

        resizeCanvas();
        renderFrame();
      }

      window.addEventListener("resize", () => {
        window.clearTimeout(resizeTimer);

        resizeTimer = window.setTimeout(() => {
          restartAnimation();
        }, 150);
      });

      restartAnimation();

    })();
  </script>
